<!DOCTYPE html>
<html>
<head>
  <style>
    .parent {
      height: 300px;
      border: 2px solid black;

      display: flex;
      justify-content: space-between; /* left, center, right */
      align-items: flex-end;          /* bottom */
      padding: 10px;
    }

    .child {
      width: 60px;
      height: 60px;
      background: red;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="parent">
    <div class="child">1</div>
    <div class="child">2</div>
    <div class="child">3</div>
  </div>

</body>
</html>
