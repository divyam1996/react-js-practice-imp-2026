<!DOCTYPE html>
<html>
<head>
  <style>
    .parent {
      height: 300px;
      border: 2px solid black;

      display: grid;
      /* grid-template-columns: repeat(3, 1fr); */
      align-items: end;   /* bottom */
      padding: 10px;
    }

    .child {
      width: 60px;
      height: 60px;
      background: blue;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .child1 {
      justify-self: start;   /* left */
    }

    .child2 {
      justify-self: center;  /* middle */
    }

    .child3 {
      justify-self: end;     /* right */
    }
  </style>
</head>
<body>

  <div class="parent">
    <div class="child child1">1</div>
    <div class="child child2">2</div>
    <div class="child child3">3</div>
  </div>

</body>
</html>
